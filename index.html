<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src-styles.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="responsive.css" />
    <title>Hotel Booking Confirmation</title>
  </head>
  <body>
    <section class="dashboard">
      <aside class="sidebar">
        <header class="sidebar-header">
          <a href="#" class="logo">
            <img src="assets/images/logo.svg" alt="" />
          </a>
        </header>
        <div class="sidebar-main">
          <nav class="sidebar-navigation">
            <ul>
              <li>
                <a href="#stay" class="nav-link active">
                  <img src="assets/images/icon-bed.svg" alt="" />
                  <span>Your Stay</span>
                  <span class="notification">1</span>
                </a>
              </li>
              <li>
                <a href="#house" class="nav-link">
                  <img src="assets/images/icon-house.svg" alt="" />
                  <span>The house</span>
                </a>
              </li>
              <li>
                <a href="#around-town" class="nav-link">
                  <img src="assets/images/icon-pin.svg" alt="" />
                  <span>Aroun town</span>
                </a>
              </li>
              <li>
                <a href="#breakfast" class="nav-link">
                  <img src="assets/images/icon-breakfast-outline.svg" alt="" />
                  <span>Break fast</span>
                </a>
              </li>
              <li>
                <a href="#messages" class="nav-link">
                  <img src="assets/images/icon-mail.svg" alt="" />
                  <span>Messages</span>
                </a>
              </li>
            </ul>
          </nav>
          <!-- Weather Information -->
          <div class="weather-information">
            <p class="weather-location">Today in Cassis</p>
            <p class="temperature">27<sup>°</sup></p>

            <p class="weather-description">Sunny · light breeze</p>
          </div>
        </div>
        <!-- Sidebar-Footer -->
        <footer class="sidebar-footer">
          <p>Est. 1987</p>

          <address>Maison Soleil · 12 Rue des Oliviers · Cassis</address>

          <small>© 2026 Maison Soleil</small>
        </footer>
      </aside>
      <main>
        <h1>Main</h1>
      </main>
    </section>
  </body>
</html>
